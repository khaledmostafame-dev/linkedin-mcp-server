name: Build & publish images

# Forgejo Actions on the NAS -- see Synology/Forgejo-self-hosted-runbook.md.
# Images are built here (never on GitHub/GHCR/Docker Hub) and pushed to the
# self-hosted registry. A mirror-sync push (GitHub -> Forgejo) auto-fires
# `on: push`; workflow_dispatch is a manual fallback.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Compute short sha
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Login to registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login git.khaled.synology.me -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build and push image
        run: |
          REG=git.khaled.synology.me/khaledmostafame-dev
          docker build -t $REG/linkedin-mcp-server:latest -t $REG/linkedin-mcp-server:${{ steps.vars.outputs.short_sha }} .
          docker push $REG/linkedin-mcp-server:latest
          docker push $REG/linkedin-mcp-server:${{ steps.vars.outputs.short_sha }}

      # Link the package to this repo so it shows under the repo's Packages
      # tab. Non-fatal: 201=linked, 409=already linked, 403/401=token lacks
      # repo-link rights.
      - name: Link package to repo
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: token ${{ secrets.REGISTRY_TOKEN }}" \
            "https://git.khaled.synology.me/api/v1/packages/khaledmostafame-dev/container/linkedin-mcp-server/-/link/linkedin-mcp-server" \
            || echo curl-failed)
          echo "link linkedin-mcp-server -> linkedin-mcp-server : $code"

      # Push alone does not deploy: the stack keeps running the image it already pulled. The Portainer
      # stack webhook repulls :latest and recreates only containers whose image changed.
      # Loud on purpose: a green build with a stale container is the failure this step exists to end.
      # 404 = the stack lost its webhook (a Portainer stack update that omits "Webhook" clears it).
      # 409 = a deploy is already running (this stack or another one on the NAS): wait and retry.
      - name: Redeploy the Portainer stack
        run: |
          if [ -z "${{ secrets.PORTAINER_WEBHOOK_URL }}" ]; then
            echo "PORTAINER_WEBHOOK_URL is not set: image pushed but NOT deployed"; exit 1
          fi
          for i in $(seq 1 24); do                     # ~12 min: Portainer runs one deploy at a time, and three
                                                     # apps pushed together queue behind each other's image pulls
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 300 -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}")
            echo "portainer redeploy -> $code (try $i)"
            if [ "$code" = "204" ] || [ "$code" = "200" ]; then exit 0; fi
            [ "$code" = "409" ] || exit 1
            sleep 30
          done
          exit 1
